name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build-binaries:
    name: Build ${{ matrix.target.pkg }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { pkg: cli-darwin-arm64, goos: darwin,  goarch: arm64, ext: ""     }
          - { pkg: cli-darwin-x64,   goos: darwin,  goarch: amd64, ext: ""     }
          - { pkg: cli-linux-x64,    goos: linux,   goarch: amd64, ext: ""     }
          - { pkg: cli-linux-arm64,  goos: linux,   goarch: arm64, ext: ""     }
          - { pkg: cli-win32-x64,    goos: windows, goarch: amd64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Cross-compile binary
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p packages/${{ matrix.target.pkg }}/bin
          go build -trimpath -ldflags="-s -w" \
            -o packages/${{ matrix.target.pkg }}/bin/capsule${{ matrix.target.ext }} \
            ./cmd/capsule

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.pkg }}
          path: packages/${{ matrix.target.pkg }}/bin/

  release:
    name: Release or open PR
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Place binaries into sub-packages
        run: |
          for pkg in cli-darwin-arm64 cli-darwin-x64 cli-linux-x64 cli-linux-arm64 cli-win32-x64; do
            mkdir -p packages/$pkg/bin
            cp -r artifacts/$pkg/* packages/$pkg/bin/
            chmod +x packages/$pkg/bin/* || true
          done

      - name: Build TS packages
        run: |
          pnpm --filter @capsule-css/core build
          pnpm --filter @capsule-css/vite build

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish --tag alpha
          title: "chore: release alpha"
          commit: "chore: release alpha"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          CHANGELOG_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
